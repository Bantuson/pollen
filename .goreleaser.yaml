# GoReleaser configuration for Pollen
#
# FORK-03 (reproducible builds): mod_timestamp pins the build to the commit
# timestamp and -trimpath strips local paths, so a tagged release rebuilds
# byte-for-byte. -buildvcs=false suppresses Go 1.18+ VCS stamping (absent
# from upstream's goreleaser — added here explicitly per RESEARCH Pitfall 1).
# SDEF-02 (Sigstore signing): the signs section uses cosign v3 keyless OIDC
# to sign checksums.txt, with NO long-lived signing keys. The OIDC identity
# is auto-bound to github.com/bantuson/pollen/.github/workflows/release.yml
# by the GitHub Actions environment (RESEARCH Pattern 5).
#
# SDEF-02 (SBOM): CycloneDX SBOM per archive via syft. Records the source
# upstream commit (pinned SHA c24089804ee66ece4bec6f14638cb98985389cdb)
# in the SBOM for supply-chain provenance.
#
# SLSA Level 3 provenance attestation is generated by the GitHub Actions
# release workflow, not GoReleaser — see .github/workflows/release.yml.
#
# NOTE: Pollen has NO eBPF code — the before.hooks block from beekeeper's
# goreleaser (sh -c 'if [ "$(uname -s)" = "Linux" ]; then go generate ...') is
# intentionally absent. Do NOT add it.
version: 2

builds:
  - env:
      - CGO_ENABLED=0
    goos:
      - linux
      - darwin
      - windows
    goarch:
      - amd64
      - arm64
    # Reproducibility: stamp the build with the commit time, not the build time.
    mod_timestamp: "{{ .CommitTimestamp }}"
    flags:
      - -trimpath
      - -buildvcs=false
    ldflags:
      - -s -w
      # NOTE: Pollen keeps Version in package main (not internal/version).
      # The ldflags target is main.Version, NOT a version subpackage path.
      - -X main.Version={{.Version}}
    binary: pollen

checksums:
  name_template: "checksums.txt"

# cosign v3 keyless signing of checksums.txt. Signing the checksum file
# transitively covers every released artifact. The OIDC identity is bound into
# the Sigstore certificate by the GitHub Actions workflow (id-token: write).
# No identity arg is needed — it is provided automatically by the OIDC token.
signs:
  - cmd: cosign
    signature: "${artifact}.sigstore.json"
    args:
      - sign-blob
      - "--bundle=${signature}"
      - "${artifact}"
      - "--yes"
    artifacts: checksum

# SDEF-02 (SBOM): syft-generated CycloneDX SBOM per archive. GoReleaser
# invokes syft after the archive is built. The CycloneDX format is required
# per the locked decision in 01-CONTEXT.md; the default would be SPDX-JSON.
sboms:
  - id: pollen-sbom
    cmd: syft
    artifacts: archive
    args:
      - "$artifact"
      - "--output"
      - "cyclonedx-json=$document"
    documents:
      - "${artifact}.cdx.json"

archives:
  - formats: [tar.gz]
    format_overrides:
      - goos: windows
        formats: [zip]

release:
  draft: false
