# CI workflow for Pollen
#
# PTEST-02 / PTEST-03: Runs the 3-OS test matrix (ubuntu-latest, macos-latest,
# windows-latest) with go test -race (CGO_ENABLED: 1 — see Pitfall 5 in
# 01-RESEARCH.md: the race detector requires CGO on all platforms; windows-latest
# has MSVC), pollen selftest (PTEST-03), and govulncheck (mirrors upstream posture).
#
# The differential job (PTEST-02) invokes the LOCKED test name TestDifferential
# via `go test ./cmd/pollen/ -run '^TestDifferential$'` on Linux and macOS only.
# This name is LOCKED in plan 03 (01-03-SUMMARY.md). The test itself pins the
# upstream SHA c24089804ee66ece4bec6f14638cb98985389cdb, clones it, and runs the
# NDJSON normalization harness. CI=true (set by GitHub Actions) causes the test to
# t.Fatalf on clone failure (plan 03 skip-vs-fail asymmetry).
#
# Beekeeper-specific jobs (sentry kernel VMs, platform event-log monitoring,
# bpf bytecode generation, fuzz gates) are intentionally absent — Pollen has
# no sentry, event-tracing, or bpf code. This is the complete CI for Pollen.
name: CI

on:
  pull_request:
  push:
    branches: [main]

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: Verify dependencies
        run: go mod verify

      - name: Build
        run: go build -v -trimpath -buildvcs=false ./...

      - name: Test
        run: go test -v -race ./...
        env:
          CGO_ENABLED: 1 # the race detector requires CGO (Pitfall 5: windows-latest has MSVC)

      - name: Vet
        run: go vet ./...

      - name: Selftest
        shell: bash
        run: |
          go build -trimpath -buildvcs=false -o ./dist/pollen-selftest ./cmd/pollen
          ./dist/pollen-selftest selftest

      - name: Check go.mod/go.sum are tidy
        run: |
          go mod tidy
          git diff --exit-code go.mod go.sum

  govulncheck:
    # Mirrors upstream's govulncheck posture (trivially fast with zero external deps).
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: Install govulncheck
        run: go install golang.org/x/vuln/cmd/govulncheck@latest

      - name: govulncheck
        run: govulncheck ./...

  differential:
    # PTEST-02: Differential guard — proves pollen == upstream bumblebee on a
    # fixed npm/pypi/mcp fixture after NDJSON normalization (strip 7 non-det
    # fields + scanner_name, sort by record_id). Linux+macOS only — TestDifferential
    # skips on Windows with a structured Phase-2 reason (plan 03 decision).
    #
    # HARD GATE: the test name TestDifferential is LOCKED in plan 03. ci.yml
    # invokes it via -run '^TestDifferential$' (anchored). The 01-03-SUMMARY.md
    # presence was verified before writing this file (Task 2a gate check).
    #
    # CI=true is set automatically by GitHub Actions runners. plan 03's
    # skip-vs-fail asymmetry: CI=true → t.Fatalf on clone/build error (loud);
    # CI=false (local) → t.Skip (graceful offline dev).
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: Run differential test (LOCKED name — TestDifferential)
        run: go test ./cmd/pollen/ -run '^TestDifferential$' -count=1 -v
        # TestDifferential itself clones upstream at pinned SHA
        # c24089804ee66ece4bec6f14638cb98985389cdb, builds bumblebee, runs both
        # pollen and bumblebee on the committed diff-fixture, and asserts
        # normalized NDJSON outputs are identical.
